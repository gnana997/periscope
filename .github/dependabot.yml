# Dependabot — auto-PRs for vulnerable / outdated dependencies across
# the four ecosystems Periscope cares about. Weekly cadence keeps PR
# noise low while still catching CVEs within a reasonable window.
#
# Grouping: minor + patch updates land in a single PR per ecosystem so
# a typical week is one consolidated PR per ecosystem rather than a
# fan-out of 30 single-package bumps. Major updates still fan out so
# we can review breaking changes individually.

version: 2

updates:
  # Go modules — the central server, agent, and shared internal packages.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  # npm — the SPA + tooling under web/.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # Some bundled dev-deps (vitest plugins, eslint configs) churn
    # weekly with cosmetic-only releases. Ignore patch-only bumps for
    # those to keep the dashboard tidy.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  # GitHub Actions — every `uses:` is pinned by full commit SHA with a
  # trailing `# vX.Y.Z` comment. Dependabot bumps both the SHA and the
  # comment when a new release ships so the pins don't rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns:
          - "*"

  # Container base images — Dockerfile + Dockerfile.agent. The FROM
  # lines are digest-pinned (@sha256:...); without this ecosystem the
  # pins silently rot on an old base with unpatched CVEs.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      docker-all:
        patterns:
          - "*"
